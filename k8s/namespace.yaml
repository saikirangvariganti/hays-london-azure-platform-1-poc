apiVersion: v1
kind: Namespace
metadata:
  name: mobile-platform
  labels:
    name: mobile-platform
    environment: production
    team: platform-engineering
    workload-type: mobile-backend
  annotations:
    description: "Namespace for iOS/Android mobile app backend workloads"
    owner: "platform-engineering@gov.uk"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mobile-platform-quota
  namespace: mobile-platform
spec:
  hard:
    requests.cpu: "20"
    requests.memory: "40Gi"
    limits.cpu: "40"
    limits.memory: "80Gi"
    pods: "50"
    services: "20"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: mobile-platform-limits
  namespace: mobile-platform
spec:
  limits:
  - type: Container
    default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    max:
      cpu: "4"
      memory: "8Gi"
    min:
      cpu: "50m"
      memory: "64Mi"
  - type: Pod
    max:
      cpu: "8"
      memory: "16Gi"
