apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mobile-backend-ingress
  namespace: mobile-platform
  labels:
    app: mobile-backend
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/rate-limit: "on"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    # TLS termination via cert-manager
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - api.mobile-platform.gov.uk
    secretName: mobile-platform-tls
  rules:
  - host: api.mobile-platform.gov.uk
    http:
      paths:
      # iOS API routes
      - path: /api/v1/ios(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: mobile-backend-ios-svc
            port:
              name: http
      # Android API routes
      - path: /api/v1/android(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: mobile-backend-android-svc
            port:
              name: http
      # Health check (both platforms)
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: mobile-backend-ios-svc
            port:
              name: http
